name: Ryzod
options:
  bundleIdPrefix: com.ryzod
  deploymentTarget:
    iOS: '16.0'
packages:
  RyzodCore:
    path: RyzodCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  Ryzod:
    type: application
    platform: iOS
    sources: [Ryzod]
    dependencies:
      - package: RyzodCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryzod.player
        INFOPLIST_FILE: Ryzod/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RyzodUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RyzodUITests]
    dependencies:
      - target: Ryzod
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ryzod:
    build:
      targets:
        Ryzod: all
        RyzodUITests: [test]
    test:
      targets: [RyzodUITests]
