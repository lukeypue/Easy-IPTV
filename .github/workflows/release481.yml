name: Release RYZOD 4.81 Launch Fixes
on:
  push:
    branches: [ryzod-v4.81-launch-fixes]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # All future release workflows must use this same group.
  # Historical workflows use version-specific groups; see RELEASE_4.81.md.
  group: ryzod-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/ryzod-v4.81-launch-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test updater publisher offline
        run: python3 -B -m unittest discover -s tools -p test_publish_v481.py -v
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ryzod-release.jks"
          chmod 600 "$RUNNER_TEMP/ryzod-release.jks"
      - name: Check existing Live TV and guide contracts
        run: |
          python3 tools/verify_v470.py
          python3 tools/verify_v474.py
      - name: Verify live buffering, retry sessions and memory first
        run: gradle testDebugUnitTest --tests '*PlaybackMemoryPolicyTest' --tests '*PlaybackRetrySessionTest' --tests '*BufferSettingsUiTest' --tests '*StreamBufferPolicyTest' --max-workers=1 -Pkotlin.incremental=false --no-daemon --stacktrace
      - name: Full phone/universal regression suite
        run: |
          gradle cleanTestDebugUnitTest testDebugUnitTest --max-workers=1 -Pkotlin.incremental=false --no-daemon --stacktrace
          python3 tools/verify_unit_results.py app/build/test-results/testDebugUnitTest 200
          cp -R app/build/test-results /tmp/ryzod-481-tests-direct
      - name: Lint and build signed phone/universal APK
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/ryzod-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: |
          gradle lintDebug assembleRelease -Pkotlin.incremental=false --no-daemon --stacktrace
          test -s app/build/outputs/mapping/release/mapping.txt
          cp app/build/outputs/mapping/release/mapping.txt /tmp/RYZOD-v4.81-mapping.txt
          cp app/build/outputs/apk/release/app-release.apk /tmp/RYZOD-v4.81.apk
      - name: Full Fire TV regression suite
        run: |
          gradle -PryzodDistribution=fire cleanTestDebugUnitTest testDebugUnitTest --max-workers=1 -Pkotlin.incremental=false --no-daemon --stacktrace
          python3 tools/verify_unit_results.py app/build/test-results/testDebugUnitTest 200
          cp -R app/build/test-results /tmp/ryzod-481-tests-fire
      - name: Lint and build signed Fire TV APK
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/ryzod-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: |
          gradle -PryzodDistribution=fire lintDebug assembleRelease -Pkotlin.incremental=false --no-daemon --stacktrace
          test -s app/build/outputs/mapping/release/mapping.txt
          cp app/build/outputs/mapping/release/mapping.txt /tmp/RYZOD-v4.81-FireTV-mapping.txt
          cp app/build/outputs/apk/release/app-release.apk /tmp/RYZOD-v4.81-FireTV.apk
          git archive HEAD -o /tmp/RYZOD-v4.81-source.zip
      - name: Check and package Amazon and Play candidates (artifacts only)
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/ryzod-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: |
          gradle -PryzodDistribution=amazon cleanTestDebugUnitTest testDebugUnitTest --tests '*DistributionTest' --tests '*Launcher*Test' --max-workers=1 -Pkotlin.incremental=false --no-daemon --stacktrace
          cp -R app/build/test-results /tmp/ryzod-481-tests-amazon
          gradle -PryzodDistribution=amazon lintDebug assembleRelease -Pkotlin.incremental=false --no-daemon --stacktrace
          test -s app/build/outputs/mapping/release/mapping.txt
          cp app/build/outputs/mapping/release/mapping.txt /tmp/RYZOD-v4.81-Amazon-mapping.txt
          cp app/build/outputs/apk/release/app-release.apk /tmp/RYZOD-v4.81-Amazon.apk
          gradle -PryzodDistribution=play cleanTestDebugUnitTest testDebugUnitTest --tests '*DistributionTest' --tests '*Launcher*Test' --max-workers=1 -Pkotlin.incremental=false --no-daemon --stacktrace
          cp -R app/build/test-results /tmp/ryzod-481-tests-play
          gradle -PryzodDistribution=play lintDebug bundleRelease -Pkotlin.incremental=false --no-daemon --stacktrace
          test -s app/build/outputs/mapping/release/mapping.txt
          cp app/build/outputs/mapping/release/mapping.txt /tmp/RYZOD-v4.81-Play-mapping.txt
          cp app/build/outputs/bundle/release/app-release.aab /tmp/RYZOD-v4.81-Play.aab
      - name: Verify exact APK identity, signing, SDK and alignment
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          for APK in /tmp/RYZOD-v4.81.apk /tmp/RYZOD-v4.81-FireTV.apk /tmp/RYZOD-v4.81-Amazon.apk; do
            "$AAPT" dump badging "$APK" | grep "name='com.easyiptv.player'" | grep "versionCode='105'" | grep "versionName='4.81'"
            "$AAPT" dump badging "$APK" | grep "targetSdkVersion:'36'"
            "$SIGNER" verify --verbose "$APK"
            ACTUAL="$("$SIGNER" verify --print-certs "$APK" | sed -nE 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
            test "$ACTUAL" = 8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165
            "$ZIPALIGN" -c -P 16 4 "$APK"
            python3 tools/verify_native_alignment.py "$APK"
          done
          # Amazon must rely on its store, not the direct APK updater.
          "$AAPT" dump permissions /tmp/RYZOD-v4.81-Amazon.apk > "$RUNNER_TEMP/amazon-permissions.txt"
          ! grep -q REQUEST_INSTALL_PACKAGES "$RUNNER_TEMP/amazon-permissions.txt"
          jarsigner -verify /tmp/RYZOD-v4.81-Play.aab
          keytool -printcert -jarfile /tmp/RYZOD-v4.81-Play.aab | grep 'SHA256:' | tr -d ':' | grep 8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165
      - name: Retain verified store candidates without publishing to stores
        uses: actions/upload-artifact@v4
        with:
          name: RYZOD-4.81-store-submission-candidates
          path: |
            /tmp/RYZOD-v4.81-Amazon.apk
            /tmp/RYZOD-v4.81-Play.aab
            /tmp/RYZOD-v4.81-Amazon-mapping.txt
            /tmp/RYZOD-v4.81-Play-mapping.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RYZOD-4.81-test-results
          path: |
            /tmp/ryzod-481-tests-*
            app/build/test-results
      - name: Retain verified signed builds
        uses: actions/upload-artifact@v4
        with:
          name: RYZOD-4.81-signed-builds
          path: |
            /tmp/RYZOD-v4.81.apk
            /tmp/RYZOD-v4.81-FireTV.apk
            /tmp/RYZOD-v4.81-source.zip
            /tmp/RYZOD-v4.81-mapping.txt
            /tmp/RYZOD-v4.81-FireTV-mapping.txt
          if-no-files-found: error
      - name: Reject updater downgrades and conflicting rebuilds before release writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_v481.py --check
      - name: Publish verified signed testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check even an existing tag that has no release yet. Fail on lookup errors.
          REMOTE_TAG="$(git ls-remote origin refs/tags/v4.81 'refs/tags/v4.81^{}')"
          if test -n "$REMOTE_TAG"; then
            git fetch origin refs/tags/v4.81:refs/tags/v4.81
            test "$(git rev-parse 'v4.81^{commit}')" = "$GITHUB_SHA" || { echo 'This version is already published from another commit; increment the version.'; exit 1; }
          fi
          if gh release view v4.81 >/dev/null 2>&1; then
            # Published binaries are immutable. A rerun must match both APK digests.
            python3 tools/publish_v481.py --verify-release
          else
            gh release create v4.81 /tmp/RYZOD-v4.81.apk /tmp/RYZOD-v4.81-FireTV.apk /tmp/RYZOD-v4.81-source.zip --target "$GITHUB_SHA" --title "RYZOD 4.81 Launch Fixes" --notes-file RELEASE_4.81.md --latest=false
          fi
      - name: Publish matching updater manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/publish_v481.py
          gh release edit v4.81 --latest
