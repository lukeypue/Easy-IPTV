name: Release RYZOD 4.54 Rebrand and Live Stability

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release444:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

            - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent RYZOD signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zako-release.jks"
          chmod 600 "$RUNNER_TEMP/zako-release.jks"

      - name: Build signed release APK
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/zako-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK identity and signing
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep "package: name='com.easyiptv.player'" | grep "versionCode='78'" | grep "versionName='4.54'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/^(V[0-9.]+ Signer: |Signer #1 )certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165"
          test "$ACTUAL" = "$EXPECTED"
          cp "$APK" app/build/outputs/apk/release/RYZOD-v4.54.apk
          sha256sum app/build/outputs/apk/release/RYZOD-v4.54.apk

      - name: Package generated source
        run: |
          rm -rf review-package
          mkdir -p review-package
          cp -R app review-package/
          cp build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat review-package/ 2>/dev/null || true
          cp -R gradle review-package/ 2>/dev/null || true
          cp -R tools scripts review-package/ 2>/dev/null || true
          find review-package -type d -name build -prune -exec rm -rf {} + || true
          (cd review-package && zip -qr ../RYZOD-v4.54-source.zip .)
          test -s RYZOD-v4.54-source.zip

      - name: Publish RYZOD 4.54 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="RYZOD rebrand and live-TV stability update. Rebrands the app to RYZOD and prevents long-running timeshift DVR files from blocking channel changes by retiring large temporary files off the UI thread."
          if gh release view v4.54 >/dev/null 2>&1; then
            gh release upload v4.54 app/build/outputs/apk/release/RYZOD-v4.54.apk RYZOD-v4.54-source.zip --clobber
            gh release edit v4.54 --title "RYZOD 4.54 Download Stability" --notes "$NOTES" --prerelease=false --latest
          else
            gh release create v4.54 app/build/outputs/apk/release/RYZOD-v4.54.apk RYZOD-v4.54-source.zip --target "$GITHUB_SHA" --title "RYZOD 4.54 Download Stability" --notes "$NOTES" --latest
          fi

      - name: Point in-app updater to 4.44
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/latest.json <<'JSON'
          {
            "versionCode": 78,
            "versionName": "4.54",
            "downloadUrl": "https://github.com/lukeypue/Easy-IPTV/releases/download/v4.54/RYZOD-v4.54.apk"
          }
          JSON
          CONTENT="$(base64 -w0 /tmp/latest.json)"
          for attempt in 1 2 3 4 5; do
            SHA="$(gh api repos/lukeypue/Easy-IPTV/contents/latest.json?ref=main --jq .sha)"
            if gh api --method PUT repos/lukeypue/Easy-IPTV/contents/latest.json -f message='Point updater to RYZOD 4.54' -f content="$CONTENT" -f sha="$SHA" -f branch='main'; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Verify published release and updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.54 --json assets --jq '.assets[].name' | grep '^RYZOD-v4.54.apk$'
          sleep 5
          RAW="$(gh api repos/lukeypue/Easy-IPTV/contents/latest.json?ref=main --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$RAW" | grep '"versionCode": 78'
          printf '%s' "$RAW" | grep '"versionName": "4.54"'
          printf '%s' "$RAW" | grep 'releases/download/v4.54/RYZOD-v4.54.apk'

      - name: Upload signed release and source
        uses: actions/upload-artifact@v4
        with:
          name: RYZOD-v4.54-release
          path: |
            app/build/outputs/apk/release/RYZOD-v4.54.apk
            RYZOD-v4.54-source.zip
          if-no-files-found: error
