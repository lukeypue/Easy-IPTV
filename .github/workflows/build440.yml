name: Build Zako 4.40 Rolling DVR Foundation

on:
  push:
    branches: [ "zako-v4.40-usb-internal-dvr" ]
  workflow_dispatch:

jobs:
  build440:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Generate Zako 4.40 source with RED to GREEN verification
        run: |
          python3 tools/fix_v424_patcher_source.py
          python3 tools/apply_v424.py
          python3 tools/apply_v424_post.py
          python3 tools/apply_v425.py
          python3 tools/apply_v425_remote_info.py
          python3 tools/apply_v426_updater.py
          python3 tools/apply_v428.py
          python3 tools/apply_v429.py
          python3 tools/apply_v430.py
          python3 tools/apply_v431.py
          python3 tools/verify_v425.py
          python3 tools/verify_v426_updater.py
          python3 tools/verify_v431.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_v432.py')
          t = p.read_text()
          t = t.replace("search_key_marker = '@Composable\\nprivate fun SearchKey('", "search_key_marker = '@Composable\\nprivate fun androidx.compose.foundation.layout.RowScope.SearchKey('")
          p.write_text(t)
          PY
          python3 tools/apply_v432.py
          python3 tools/verify_v432.py
          python3 tools/apply_v433.py
          python3 tools/verify_v433.py
          python3 tools/apply_v434.py
          python3 tools/verify_v434.py
          python3 tools/apply_v435.py
          python3 tools/verify_v435.py
          python3 tools/fix_v436_patcher.py
          python3 tools/apply_v436.py
          python3 tools/verify_v436.py
          python3 tools/apply_v437.py
          python3 tools/verify_v437.py
          python3 tools/apply_v438.py
          python3 tools/verify_v438.py
          python3 tools/apply_v439.py
          python3 tools/verify_v439.py
          if python3 tools/verify_v440.py; then
            echo "ERROR: v4.40 verifier passed before v4.40 patch"
            exit 1
          else
            echo "Expected RED: v4.40 rolling DVR features absent"
          fi
          python3 tools/fix_v440_patcher.py
          python3 tools/apply_v440.py
          python3 tools/verify_v440.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile 4.40 debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zako-v4.40-foundation-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
