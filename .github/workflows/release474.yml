name: Release RYZOD 4.74 Live TV Stability
on:
  push:
    branches: [ryzod-v4.74-live-search]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ryzod-474
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check release contracts and full regression suite
        run: |
          python3 tools/verify_v470.py
          python3 tools/verify_v474.py
          gradle testDebugUnitTest --no-daemon --stacktrace
          gradle lintDebug --no-daemon --stacktrace
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ryzod-release.jks"
          chmod 600 "$RUNNER_TEMP/ryzod-release.jks"
      - name: Build exact checked-in source
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/ryzod-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify signed APK and package source
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep "name='com.easyiptv.player'" | grep "versionCode='98'" | grep "versionName='4.74'"
          "$SIGNER" verify --verbose "$APK"
          ACTUAL="$("$SIGNER" verify --print-certs "$APK" | sed -nE 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = 8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165
          cp "$APK" /tmp/RYZOD-v4.74.apk
          git archive HEAD -o /tmp/RYZOD-v4.74-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RYZOD-v4.74-review-build
          path: |
            /tmp/RYZOD-v4.74.apk
            /tmp/RYZOD-v4.74-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RYZOD-4.74-test-results
          path: app/build/test-results
      - name: Publish verified signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.74 >/dev/null 2>&1; then
            gh release upload v4.74 /tmp/RYZOD-v4.74.apk /tmp/RYZOD-v4.74-source.zip --clobber
            gh release edit v4.74 --title "RYZOD 4.74 Live TV Stability" --notes-file RELEASE_4.74.md --latest
          else
            gh release create v4.74 /tmp/RYZOD-v4.74.apk /tmp/RYZOD-v4.74-source.zip --target "$GITHUB_SHA" --title "RYZOD 4.74 Live TV Stability" --notes-file RELEASE_4.74.md --latest
          fi
      - name: Publish matching updater manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_v474.py
