name: Build Zako 4.30 Release APK

on:
  push:
    branches: [ "zako-v4.24-polish" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release430:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Apply and verify Zako 4.30 source patches
        run: |
          python3 tools/fix_v424_patcher_source.py
          python3 tools/apply_v424.py
          python3 tools/apply_v424_post.py
          python3 tools/apply_v425.py
          python3 tools/apply_v425_remote_info.py
          python3 tools/apply_v426_updater.py
          python3 tools/apply_v428.py
          python3 tools/verify_v425.py
          python3 tools/verify_v426_updater.py
          python3 tools/verify_v428.py
          python3 tools/apply_v429.py
          python3 tools/verify_v425.py
          python3 tools/verify_v426_updater.py
          python3 tools/verify_v429.py
          if python3 tools/verify_v430.py; then
            echo "ERROR: v4.30 verifier passed before v4.30 patch"
            exit 1
          else
            echo "Expected RED: v4.30 behavior absent before patch"
          fi
          python3 tools/apply_v430.py
          python3 tools/verify_v425.py
          python3 tools/verify_v426_updater.py
          python3 tools/verify_v430.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent Zako signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zako-release.jks"
          chmod 600 "$RUNNER_TEMP/zako-release.jks"

      - name: Build signed release APK
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/zako-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK identity and signing
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep "versionCode='55'" | grep "versionName='4.30'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/^(V[0-9.]+ Signer: |Signer #1 )certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165"
          test "$ACTUAL" = "$EXPECTED"
          cp "$APK" app/build/outputs/apk/release/Zako-v4.30.apk

      - name: Publish Zako 4.30 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.30 >/dev/null 2>&1; then
            gh release upload v4.30 app/build/outputs/apk/release/Zako-v4.30.apk --clobber
          else
            gh release create v4.30 app/build/outputs/apk/release/Zako-v4.30.apk \
              --target "$GITHUB_SHA" \
              --title "Zako 4.30 Low-Memory Guide" \
              --notes "Fire TV low-memory catalog hardening, progressive 40-item browsing with one page ahead, duplicate-safe Series rows, episode descriptions, bright-yellow guide titles, and Left-to-guide on Live TV. No playlists or content included." \
              --prerelease
          fi

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Zako-v4.30-release
          path: app/build/outputs/apk/release/Zako-v4.30.apk
          if-no-files-found: error
