name: Build Zako 4.42 feature branch

on:
  push:
    branches: [ "zako-v442-search-startup" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          ref: zako-v442-search-startup
          fetch-depth: 0

      - name: Apply v4.42 source changes
        run: python scripts/apply_v442.py

      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/easyiptv/player/MainActivity.kt
          git diff --cached --check
          git commit -m "Implement Zako 4.42 startup, search and 3D fixes"
          git push origin HEAD:zako-v442-search-startup

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zako-4.42-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
