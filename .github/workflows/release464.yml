name: Release RYZOD 4.64
on:
  workflow_dispatch:
  push:
    branches: [ryzod-v4.55-verified]
    paths:
      - '.github/RYZOD_464_RELEASE_TRIGGER'
permissions:
  contents: write
concurrency:
  group: ryzod-release-464
  cancel-in-progress: true
jobs:
  release464:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate 4.63 baseline and apply 4.64 repairs
        run: |
          bash tools/generate_v463.sh
          python3 tools/apply_v464.py
      - name: Verify existing recording and playback safeguards
        run: |
          python3 tools/verify_v449_schedule_core.py
          python3 tools/verify_v449_recovery.py
          python3 tools/verify_v449_ui.py
          python3 tools/verify_v449_screen.py
          python3 tools/verify_v448_scheduler.py
          python3 tools/verify_v448_dvr.py
          python3 tools/verify_v448_recording_ownership.py
          python3 tools/verify_v448_transport.py
          python3 tools/verify_v448_ui_resilience.py
      - name: Preserve exact compiled source
        uses: actions/upload-artifact@v4
        with:
          name: RYZOD-v4.64-generated-source
          path: |
            app/src
            app/build.gradle.kts
            app/proguard-rules.pro
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
          if-no-files-found: error
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zako-release.jks"
          chmod 600 "$RUNNER_TEMP/zako-release.jks"
      - name: Build signed release
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/zako-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace
      - name: Verify APK identity version and signature
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep "package: name='com.easyiptv.player'" | grep "versionCode='88'" | grep "versionName='4.64'"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          echo "APK signer SHA-256: $ACTUAL"
          test "$ACTUAL" = "8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165"
          cp "$APK" app/build/outputs/apk/release/RYZOD-v4.64.apk
      - name: Publish RYZOD 4.64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Three shared keyboard pages with full punctuation, 20/20-friendly title and guide matching, reliable category return with a visible Categories button, and the original RYZOD artwork for phone/TV icons."
          if gh release view v4.64 >/dev/null 2>&1; then
            gh release upload v4.64 app/build/outputs/apk/release/RYZOD-v4.64.apk --clobber
            gh release edit v4.64 --title "RYZOD 4.64 Keyboard, Search & Icons" --notes "$NOTES" --latest
          else
            gh release create v4.64 app/build/outputs/apk/release/RYZOD-v4.64.apk --target "$GITHUB_SHA" --title "RYZOD 4.64 Keyboard, Search & Icons" --notes "$NOTES" --latest
          fi
      - name: Point updater to 4.64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '{' '  "versionCode": 88,' '  "versionName": "4.64",' '  "downloadUrl": "https://github.com/lukeypue/Easy-IPTV/releases/download/v4.64/RYZOD-v4.64.apk"' '}' > /tmp/latest.json
          CONTENT="$(base64 -w0 /tmp/latest.json)"
          for attempt in 1 2 3 4 5; do
            SHA="$(gh api repos/lukeypue/Easy-IPTV/contents/latest.json?ref=main --jq .sha)"
            if gh api --method PUT repos/lukeypue/Easy-IPTV/contents/latest.json -f message='Point updater to RYZOD 4.64' -f content="$CONTENT" -f sha="$SHA" -f branch=main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Verify published release and updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.64 --json assets --jq '.assets[].name' | grep '^RYZOD-v4.64.apk$'
          RAW="$(gh api repos/lukeypue/Easy-IPTV/contents/latest.json?ref=main --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$RAW" | grep '"versionCode": 88'
          printf '%s' "$RAW" | grep '"versionName": "4.64"'
      - uses: actions/upload-artifact@v4
        with:
          name: RYZOD-v4.64-release
          path: app/build/outputs/apk/release/RYZOD-v4.64.apk
          if-no-files-found: error
