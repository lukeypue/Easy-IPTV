name: Build Easy IPTV APK

on:
  push:
    branches: [ "main", "master", "zako-v4.24-polish" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Apply Zako v4.25 source patches
        run: |
          python3 tools/fix_v424_patcher_source.py
          python3 tools/apply_v424.py
          python3 tools/apply_v424_post.py
          python3 tools/apply_v425.py
          python3 tools/apply_v425_remote_info.py
          python3 tools/verify_v425.py
          grep -q "SearchTvKeyboardField" app/src/main/java/com/easyiptv/player/MainActivity.kt
          grep -q "DvrSeekAccelerator" app/src/main/java/com/easyiptv/player/MainActivity.kt
          grep -q "LiveGridGuide" app/src/main/java/com/easyiptv/player/MainActivity.kt
          grep -q "ZAKO_V425_REMOTE_INFO" app/src/main/java/com/easyiptv/player/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zako-v4.25-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
