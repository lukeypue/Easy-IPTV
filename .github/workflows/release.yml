name: Build Zako Release APK

on:
  push:
    branches: [ "zako-v4.24-polish" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Apply Zako v4.24 source patch
        run: |
          python3 tools/fix_v424_patcher_source.py
          python3 tools/apply_v424.py
          python3 tools/apply_v424_post.py
          grep -q "SearchTvKeyboardField" app/src/main/java/com/easyiptv/player/MainActivity.kt
          grep -q "DvrSeekAccelerator" app/src/main/java/com/easyiptv/player/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent Zako signing key
        if: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zako-release.jks"
          chmod 600 "$RUNNER_TEMP/zako-release.jks"

      - name: Build release APK
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/zako-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify release manifest
        run: |
          MANIFEST="$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)"
          test -n "$MANIFEST"
          if grep -q 'android:debuggable="true"' "$MANIFEST"; then
            echo "Release manifest is debuggable; refusing artifact."
            exit 1
          fi
          if grep -q 'android.permission.DUMP' "$MANIFEST"; then
            echo "Unexpected DUMP permission found in release manifest."
            exit 1
          fi

      - name: Verify permanent signing certificate
        if: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 != '' }}
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Zako-v4.24-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
