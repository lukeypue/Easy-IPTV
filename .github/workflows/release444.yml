name: Release Zako 4.44 Download Stability
on:
  push:
    branches: [ "zako-v4.44-download-resume" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release444:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify RED then apply 4.44
        run: |
          if python3 tools/verify_v444.py; then exit 1; else echo "Expected RED"; fi
          python3 tools/apply_v444.py
          python3 tools/verify_v444.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zako-release.jks"
          chmod 600 "$RUNNER_TEMP/zako-release.jks"
      - name: Build signed release
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/zako-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify identity and permanent signature
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep "package: name='com.easyiptv.player'" | grep "versionCode='69'" | grep "versionName='4.44'"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/^(V[0-9.]+ Signer: |Signer #1 )certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165"
          cp "$APK" app/build/outputs/apk/release/Zako-v4.44.apk
          sha256sum app/build/outputs/apk/release/Zako-v4.44.apk
      - name: Package source
        run: |
          zip -qr Zako-v4.44-source.zip app tools scripts build.gradle.kts settings.gradle.kts gradle.properties gradle 2>/dev/null || true
          test -s Zako-v4.44-source.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download stability update: interrupted downloads preserve partial bytes and resume with HTTP Range when supported; servers that ignore Range safely restart. Transfer buffer reduced to 64 KiB. Existing 4.43 DVR and 4.42 startup/search/3D behavior and live playback buffers are preserved."
          gh release create v4.44 app/build/outputs/apk/release/Zako-v4.44.apk Zako-v4.44-source.zip --target "$GITHUB_SHA" --title "Zako 4.44 Download Stability" --notes "$NOTES" --latest
      - name: Point updater to 4.44
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '{' '  "versionCode": 69,' '  "versionName": "4.44",' '  "downloadUrl": "https://github.com/lukeypue/Easy-IPTV/releases/download/v4.44/Zako-v4.44.apk"' '}' > /tmp/latest.json
          CONTENT="$(base64 -w0 /tmp/latest.json)"
          for attempt in 1 2 3 4 5; do
            SHA="$(gh api repos/lukeypue/Easy-IPTV/contents/latest.json?ref=main --jq .sha)"
            if gh api --method PUT repos/lukeypue/Easy-IPTV/contents/latest.json -f message='Point updater to Zako 4.44' -f content="$CONTENT" -f sha="$SHA" -f branch=main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Verify release and updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.44 --json assets --jq '.assets[].name' | grep '^Zako-v4.44.apk$'
          RAW="$(gh api repos/lukeypue/Easy-IPTV/contents/latest.json?ref=main --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$RAW" | grep '"versionCode": 69'
          printf '%s' "$RAW" | grep 'releases/download/v4.44/Zako-v4.44.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: Zako-v4.44-release
          path: |
            app/build/outputs/apk/release/Zako-v4.44.apk
            Zako-v4.44-source.zip
          if-no-files-found: error
