name: Build Zako 4.29 Release APK

on:
  push:
    branches: [ "zako-v4.24-polish" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release429:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Apply and verify Zako 4.29 source patches
        run: |
          python3 tools/fix_v424_patcher_source.py
          python3 tools/apply_v424.py
          python3 tools/apply_v424_post.py
          python3 tools/apply_v425.py
          python3 tools/apply_v425_remote_info.py
          python3 tools/apply_v426_updater.py
          python3 tools/apply_v428.py
          python3 tools/verify_v425.py
          python3 tools/verify_v426_updater.py
          python3 tools/verify_v428.py
          if python3 tools/verify_v429.py; then
            echo "ERROR: v4.29 verifier passed before v4.29 patch"
            exit 1
          else
            echo "Expected RED: v4.29 behavior absent before patch"
          fi
          python3 tools/apply_v429.py
          python3 tools/verify_v425.py
          python3 tools/verify_v426_updater.py
          python3 tools/verify_v429.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent Zako signing key when configured
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zako-release.jks"
            chmod 600 "$RUNNER_TEMP/zako-release.jks"
            echo "ZAKO_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "ZAKO_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/zako-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify release manifest
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          candidates = glob.glob("app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml", recursive=True)
          if not candidates:
              candidates = glob.glob("app/build/intermediates/**/release/**/AndroidManifest.xml", recursive=True)
          if not candidates:
              raise SystemExit("Could not find merged release manifest")
          root = ET.parse(candidates[0]).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None or app.get(android + "debuggable") == "true":
              raise SystemExit("Unsafe release manifest")
          requested = {e.get(android + "name") for e in root if e.tag.endswith("uses-permission")}
          if "android.permission.DUMP" in requested:
              raise SystemExit("Unexpected DUMP permission")
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in requested:
              raise SystemExit("Updater permission missing")
          print("Release manifest verified")
          PY

      - name: Verify permanent signing certificate
        if: env.ZAKO_SIGNING_CONFIGURED == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/^(V[0-9.]+ Signer: |Signer #1 )certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Prepare updater APK
        if: env.ZAKO_SIGNING_CONFIGURED == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" app/build/outputs/apk/release/Zako-v4.29.apk

      - name: Publish Zako 4.29 prerelease
        if: env.ZAKO_SIGNING_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.29 >/dev/null 2>&1; then
            gh release upload v4.29 app/build/outputs/apk/release/Zako-v4.29.apk --clobber
          else
            gh release create v4.29 app/build/outputs/apk/release/Zako-v4.29.apk \
              --target "$GITHUB_SHA" \
              --title "Zako 4.29 Premium Search" \
              --notes "Premium futuristic UI refresh plus fast local unified search across titles, provider-supplied cast/director/genre metadata, live TV and guide. Search movie rows now have a visible download button on Android and Fire TV. No playlists or content included." \
              --prerelease
          fi

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Zako-v4.29-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
