name: Release RYZOD 4.75 Store Compatibility
on:
  push:
    branches: [ryzod-v4.75-store-compat]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ryzod-475
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ryzod-release.jks"
          chmod 600 "$RUNNER_TEMP/ryzod-release.jks"
      - name: Check and build all distributions
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/ryzod-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: |
          python3 tools/verify_v470.py
          python3 tools/verify_v474.py
          gradle testDebugUnitTest --max-workers=1 --no-daemon --stacktrace
          gradle lintDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk /tmp/RYZOD-v4.75.apk
          cp -R app/build/test-results /tmp/ryzod-475-tests-direct
          gradle -PryzodDistribution=fire testDebugUnitTest --max-workers=1 --no-daemon --stacktrace
          gradle -PryzodDistribution=fire lintDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk /tmp/RYZOD-v4.75-FireTV.apk
          cp -R app/build/test-results /tmp/ryzod-475-tests-fire
          gradle -PryzodDistribution=amazon testDebugUnitTest --tests '*DistributionTest' --tests '*Launcher*Test' --max-workers=1 --no-daemon --stacktrace
          gradle -PryzodDistribution=amazon lintDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk /tmp/RYZOD-v4.75-Amazon.apk
          gradle -PryzodDistribution=play testDebugUnitTest --tests '*DistributionTest' --tests '*Launcher*Test' --max-workers=1 --no-daemon --stacktrace
          gradle -PryzodDistribution=play lintDebug bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab /tmp/RYZOD-v4.75-Play.aab
          git archive HEAD -o /tmp/RYZOD-v4.75-source.zip
      - name: Verify exact APK identity, signing, SDK and alignment
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          for APK in /tmp/RYZOD-v4.75.apk /tmp/RYZOD-v4.75-FireTV.apk /tmp/RYZOD-v4.75-Amazon.apk; do
            "$AAPT" dump badging "$APK" | grep "name='com.easyiptv.player'" | grep "versionCode='99'" | grep "versionName='4.75'"
            "$AAPT" dump badging "$APK" | grep "targetSdkVersion:'36'"
            "$SIGNER" verify --verbose "$APK"
            ACTUAL="$("$SIGNER" verify --print-certs "$APK" | sed -nE 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
            test "$ACTUAL" = 8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165
            "$ZIPALIGN" -c -P 16 4 "$APK"
            python3 tools/verify_native_alignment.py "$APK"
          done
          ! "$AAPT" dump permissions /tmp/RYZOD-v4.75-Amazon.apk | grep REQUEST_INSTALL_PACKAGES
          jarsigner -verify /tmp/RYZOD-v4.75-Play.aab
          keytool -printcert -jarfile /tmp/RYZOD-v4.75-Play.aab | grep 'SHA256:' | tr -d ':' | grep 8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165
      - uses: actions/upload-artifact@v4
        with:
          name: RYZOD-4.75-store-submission-candidates
          path: |
            /tmp/RYZOD-v4.75-Amazon.apk
            /tmp/RYZOD-v4.75-Play.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RYZOD-4.75-test-results
          path: |
            /tmp/ryzod-475-tests-*
            app/build/test-results
      - name: Publish verified signed testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.75 >/dev/null 2>&1; then
            gh release upload v4.75 /tmp/RYZOD-v4.75.apk /tmp/RYZOD-v4.75-FireTV.apk /tmp/RYZOD-v4.75-source.zip --clobber
            gh release edit v4.75 --title "RYZOD 4.75 Store Compatibility" --notes-file RELEASE_4.75.md --latest
          else
            gh release create v4.75 /tmp/RYZOD-v4.75.apk /tmp/RYZOD-v4.75-FireTV.apk /tmp/RYZOD-v4.75-source.zip --target "$GITHUB_SHA" --title "RYZOD 4.75 Store Compatibility" --notes-file RELEASE_4.75.md --latest
          fi
      - name: Publish matching updater manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_v475.py
