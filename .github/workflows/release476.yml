name: Release RYZOD 4.76 Search Stability
on:
  push:
    branches: [ryzod-v4.76-search-memory]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ryzod-476
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ryzod-release.jks"
          chmod 600 "$RUNNER_TEMP/ryzod-release.jks"
      - name: Check existing Live TV and guide contracts
        run: |
          python3 tools/verify_v470.py
          python3 tools/verify_v474.py
      - name: Verify Fire home icon proportions first
        run: gradle -PryzodDistribution=fire testDebugUnitTest --tests '*FireHomeArtworkTest' --max-workers=1 --no-daemon --stacktrace
      - name: Verify immediate-submit typing regression first
        run: gradle testDebugUnitTest --tests '*SearchTypingUiTest.typingAfterImmediateSubmissionKeepsTheSubmittedResults' --max-workers=1 --no-daemon --stacktrace
      - name: Full phone/universal regression suite
        run: |
          gradle testDebugUnitTest --max-workers=1 --no-daemon --stacktrace
          python3 tools/verify_unit_results.py app/build/test-results/testDebugUnitTest 153
          cp -R app/build/test-results /tmp/ryzod-476-tests-direct
      - name: Lint and build signed phone/universal APK
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/ryzod-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: |
          gradle lintDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk /tmp/RYZOD-v4.76.apk
      - name: Full Fire TV regression suite
        run: |
          gradle -PryzodDistribution=fire testDebugUnitTest --max-workers=1 --no-daemon --stacktrace
          python3 tools/verify_unit_results.py app/build/test-results/testDebugUnitTest 153
          cp -R app/build/test-results /tmp/ryzod-476-tests-fire
      - name: Lint and build signed Fire TV APK
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/ryzod-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: |
          gradle -PryzodDistribution=fire lintDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk /tmp/RYZOD-v4.76-FireTV.apk
          git archive HEAD -o /tmp/RYZOD-v4.76-source.zip
      - name: Verify exact APK identity, signing, SDK and alignment
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          for APK in /tmp/RYZOD-v4.76.apk /tmp/RYZOD-v4.76-FireTV.apk; do
            "$AAPT" dump badging "$APK" | grep "name='com.easyiptv.player'" | grep "versionCode='100'" | grep "versionName='4.76'"
            "$AAPT" dump badging "$APK" | grep "targetSdkVersion:'36'"
            "$SIGNER" verify --verbose "$APK"
            ACTUAL="$("$SIGNER" verify --print-certs "$APK" | sed -nE 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
            test "$ACTUAL" = 8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165
            "$ZIPALIGN" -c -P 16 4 "$APK"
            python3 tools/verify_native_alignment.py "$APK"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RYZOD-4.76-test-results
          path: |
            /tmp/ryzod-476-tests-*
            app/build/test-results
      - name: Publish verified signed testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.76 >/dev/null 2>&1; then
            gh release upload v4.76 /tmp/RYZOD-v4.76.apk /tmp/RYZOD-v4.76-FireTV.apk /tmp/RYZOD-v4.76-source.zip --clobber
            gh release edit v4.76 --title "RYZOD 4.76 Search Stability" --notes-file RELEASE_4.76.md --latest
          else
            gh release create v4.76 /tmp/RYZOD-v4.76.apk /tmp/RYZOD-v4.76-FireTV.apk /tmp/RYZOD-v4.76-source.zip --target "$GITHUB_SHA" --title "RYZOD 4.76 Search Stability" --notes-file RELEASE_4.76.md --latest
          fi
      - name: Publish matching updater manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_v476.py
