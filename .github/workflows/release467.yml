name: Release RYZOD 4.67
on:
  workflow_dispatch:
  push:
    branches: [ryzod-v4.55-verified]
    paths:
      - '.github/RYZOD_467_RELEASE_TRIGGER'
permissions:
  contents: write
concurrency:
  group: ryzod-release-467
  cancel-in-progress: true
jobs:
  release467:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate locked baseline and reviewed 4.67 changes
        run: bash tools/generate_v467.sh
      - name: Verify existing recording and playback safeguards
        run: |
          python3 tools/verify_v449_schedule_core.py
          python3 tools/verify_v449_recovery.py
          python3 tools/verify_v449_ui.py
          python3 tools/verify_v449_screen.py
          python3 tools/verify_v448_scheduler.py
          python3 tools/verify_v448_dvr.py
          python3 tools/verify_v448_recording_ownership.py
          python3 tools/verify_v448_transport.py
          python3 tools/verify_v448_ui_resilience.py
      - name: Preserve exact compiled source
        uses: actions/upload-artifact@v4
        with:
          name: RYZOD-v4.67-generated-source
          path: |
            app/src
            app/build.gradle.kts
            app/proguard-rules.pro
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
          if-no-files-found: error
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify performance ownership, cancellation, launcher and saved-item regressions
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAKO_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zako-release.jks"
          chmod 600 "$RUNNER_TEMP/zako-release.jks"
      - name: Build signed release
        env:
          ZAKO_KEYSTORE_PATH: ${{ runner.temp }}/zako-release.jks
          ZAKO_STORE_PASSWORD: ${{ secrets.ZAKO_STORE_PASSWORD }}
          ZAKO_KEY_ALIAS: ${{ secrets.ZAKO_KEY_ALIAS }}
          ZAKO_KEY_PASSWORD: ${{ secrets.ZAKO_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify APK identity version and signature
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep "package: name='com.easyiptv.player'" | grep "versionCode='91'" | grep "versionName='4.67'"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          echo "APK signer SHA-256: $ACTUAL"
          test "$ACTUAL" = "8EF5FE2873F7A9D40302E722822C05B37B471AB08DF23785FA0A1AEB19A2C165"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest467.txt
          "$AAPT" dump resources "$APK" > /tmp/resources467.txt
          python3 tools/verify_v467_apk.py /tmp/manifest467.txt /tmp/resources467.txt
          sha256sum "$APK"
          cp "$APK" app/build/outputs/apk/release/RYZOD-v4.67.apk
      - name: Publish RYZOD 4.67
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.67 >/dev/null 2>&1; then
            gh release upload v4.67 app/build/outputs/apk/release/RYZOD-v4.67.apk --clobber
            gh release edit v4.67 --title "RYZOD 4.67 Fire TV Performance" --notes-file tools/v467/RELEASE_NOTES.md --latest
          else
            gh release create v4.67 app/build/outputs/apk/release/RYZOD-v4.67.apk --target "$GITHUB_SHA" --title "RYZOD 4.67 Fire TV Performance" --notes-file tools/v467/RELEASE_NOTES.md --latest
          fi
      - name: Point updater to 4.67
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '{' '  "versionCode": 91,' '  "versionName": "4.67",' '  "downloadUrl": "https://github.com/lukeypue/Easy-IPTV/releases/download/v4.67/RYZOD-v4.67.apk"' '}' > /tmp/latest.json
          CONTENT="$(base64 -w0 /tmp/latest.json)"
          for attempt in 1 2 3 4 5; do
            SHA="$(gh api repos/lukeypue/Easy-IPTV/contents/latest.json?ref=main --jq .sha)"
            if gh api --method PUT repos/lukeypue/Easy-IPTV/contents/latest.json -f message='Point updater to RYZOD 4.67' -f content="$CONTENT" -f sha="$SHA" -f branch=main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Verify published release and updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.67 --json assets --jq '.assets[].name' | grep '^RYZOD-v4.67.apk$'
          RAW="$(gh api repos/lukeypue/Easy-IPTV/contents/latest.json?ref=main --jq .content | tr -d '\n' | base64 -d)"
          printf '%s' "$RAW" | grep '"versionCode": 91'
          printf '%s' "$RAW" | grep '"versionName": "4.67"'
      - uses: actions/upload-artifact@v4
        with:
          name: RYZOD-v4.67-release
          path: app/build/outputs/apk/release/RYZOD-v4.67.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RYZOD-v4.67-test-results
          path: app/build/test-results
          if-no-files-found: ignore
