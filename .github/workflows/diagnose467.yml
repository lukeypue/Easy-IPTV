name: Verify RYZOD 4.67 performance
on:
  push:
    branches: [ryzod-v4.67-performance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ryzod-467-performance-checks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate complete reviewed 4.67 candidate
        run: bash tools/generate_v467.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run performance and existing feature tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'REPORT'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          total = failures = errors = 0
          for path in sorted(Path('app/build/test-results').rglob('TEST-*.xml')):
              root = ET.parse(path).getroot()
              print(root.attrib)
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
          print(f'TOTAL tests={total} failures={failures} errors={errors}')
          REPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RYZOD-467-tests
          path: app/build/test-results
          if-no-files-found: error
