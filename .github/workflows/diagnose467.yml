name: Verify RYZOD 4.67 performance
on:
  push:
    branches: [ryzod-v4.67-performance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ryzod-467-performance-checks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate locked 4.66 baseline and candidate changes
        run: |
          bash tools/generate_v463.sh
          python3 tools/apply_v464.py
          python3 tools/prepare_v465_tests.py
          python3 tools/apply_v465.py
          python3 tools/apply_v466.py
          if test -f tools/apply_v467.py; then python3 tools/apply_v467.py; fi
          if test -f tools/apply_v467_memory.py; then python3 tools/apply_v467_memory.py; fi
          python3 tools/apply_v467_review.py
          python3 tools/apply_v467_icons.py
          cp tools/tests/*Test.kt app/src/test/java/com/easyiptv/player/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run performance and existing feature tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Inspect shipped 4.66 launcher resources
        if: always()
        run: |
          curl --fail --location --silent --show-error https://github.com/lukeypue/Easy-IPTV/releases/download/v4.66/RYZOD-v4.66.apk -o /tmp/RYZOD-v4.66.apk
          echo '307d6421ac6cca983c8a1dee026a6f1648b6c0e0f1ec9026d1eac012576d2a7c  /tmp/RYZOD-v4.66.apk' | sha256sum --check
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          mkdir -p app/build/launcher-audit
          "$AAPT" dump xmltree /tmp/RYZOD-v4.66.apk AndroidManifest.xml > app/build/launcher-audit/manifest466.txt
          "$AAPT" dump resources /tmp/RYZOD-v4.66.apk > app/build/launcher-audit/resources466.txt
          cat app/build/launcher-audit/manifest466.txt
          grep -A 25 -E 'spec resource .*ryzod_(launcher|tv_banner|tv_artwork)' app/build/launcher-audit/resources466.txt || true
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'REPORT'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          total = failures = errors = 0
          for path in sorted(Path('app/build/test-results').rglob('TEST-*.xml')):
              root = ET.parse(path).getroot()
              print(root.attrib)
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
          print(f'TOTAL tests={total} failures={failures} errors={errors}')
          REPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RYZOD-467-tests
          path: |
            app/build/test-results
            app/build/launcher-audit
          if-no-files-found: error
