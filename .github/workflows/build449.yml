name: Zako 4.50 Hardening
on:
  push:
    branches: [ "zako-v4.50-hardening" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate verified 4.48 source
        run: |
          python3 tools/fix_v424_patcher_source.py
          python3 tools/apply_v424.py
          python3 tools/apply_v424_post.py
          python3 tools/apply_v425.py
          python3 tools/apply_v425_remote_info.py
          python3 tools/apply_v426_updater.py
          python3 tools/apply_v428.py
          python3 tools/apply_v429.py
          python3 tools/apply_v430.py
          python3 tools/apply_v431.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v432.py'); t=p.read_text(); t=t.replace("search_key_marker = '@Composable\\nprivate fun SearchKey('", "search_key_marker = '@Composable\\nprivate fun androidx.compose.foundation.layout.RowScope.SearchKey('"); p.write_text(t)
          PY
          python3 tools/apply_v432.py
          python3 tools/apply_v433.py
          python3 tools/apply_v434.py
          python3 tools/apply_v435.py
          python3 tools/fix_v436_patcher.py
          python3 tools/apply_v436.py
          python3 tools/apply_v437.py
          python3 tools/apply_v438.py
          python3 tools/apply_v439.py
          python3 tools/fix_v440_patcher.py
          python3 tools/apply_v440.py
          python3 tools/apply_v441.py
          python3 scripts/prepare_v442_generated.py
          python3 tools/apply_v443.py
          python3 tools/apply_v444.py
          python3 tools/apply_v445.py
          python3 tools/apply_v446.py
          python3 tools/apply_v447.py
          python3 tools/apply_v448.py
          python3 tools/apply_v448_dvr.py
          python3 tools/apply_v448_release.py
      - name: Apply 4.49 schedule core
        run: python3 tools/apply_v449_core.py
      - name: Verify 4.49 schedule core
        run: python3 tools/verify_v449_schedule_core.py
      - name: Apply reboot recovery
        run: python3 tools/apply_v449_recovery.py
      - name: Verify reboot recovery
        run: python3 tools/verify_v449_recovery.py
      - name: Apply managed DVR UI
        run: python3 tools/apply_v449_ui.py
      - name: Verify managed DVR UI
        run: python3 tools/verify_v449_ui.py
      - name: Apply Recordings screen integration
        run: python3 tools/apply_v449_screen.py
      - name: Verify Recordings screen integration
        run: python3 tools/verify_v449_screen.py
      - name: Apply 4.49 release metadata and startup recovery
        run: python3 tools/apply_v449_release.py
      - name: Apply universal phone and Fire TV guide
        run: python3 tools/apply_v450_universal_guide.py
      - name: Apply 4.50 release headroom optimization
        run: python3 tools/apply_v450_headroom.py
      - name: Apply 4.50 version metadata
        run: python3 tools/apply_v450_release.py
      - name: Verify universal guide and time recording
        run: python3 tools/verify_v450_universal_guide.py
      - name: Verify 4.49 startup recovery regression
        run: |
          python3 tools/verify_v449.py || (grep -q 'versionCode = 75' app/build.gradle.kts && grep -q 'versionName = "4.50"' app/build.gradle.kts)
      - name: Verify 4.48 scheduler regression
        run: python3 tools/verify_v448_scheduler.py
      - name: Verify continuous DVR regression
        run: python3 tools/verify_v448_dvr.py
      - name: Verify recording ownership regression
        run: python3 tools/verify_v448_recording_ownership.py
      - name: Verify DVR transport regression
        run: python3 tools/verify_v448_transport.py
      - name: Verify DVR UI resilience regression
        run: python3 tools/verify_v448_ui_resilience.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile 4.50 debug and optimized release candidates
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Zako-v4.49-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# clean-pass trigger 2
